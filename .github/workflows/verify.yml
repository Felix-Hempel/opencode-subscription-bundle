name: Verify Bundle

on:
  pull_request:
  push:
    branches-ignore: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build pinned CLI
        run: docker build --tag opencode-bundle:test .
      - name: Verify CLI and isolated HOME
        run: |
          docker run --rm opencode-bundle:test --version
          docker run --rm --entrypoint sh opencode-bundle:test -c 'test "$(id -u)" = 10001 && test "$HOME" = /home/opencode'
          docker run --rm --mount type=volume,source=bundle-qa-home,target=/home/opencode opencode-bundle:test --version
          docker run --rm --mount type=volume,source=bundle-qa-home,target=/home/opencode --entrypoint sh opencode-bundle:test -c 'test -r "$HOME/.omo/omo.jsonc" && test -r "$HOME/.config/opencode/router/subscription-router.js"'
      - name: Load portable configuration and pinned plugins without accounts
        run: docker run --rm --mount type=volume,source=bundle-qa-home,target=/home/opencode opencode-bundle:test debug config > /dev/null
      - name: Run offline tests inside container
        run: docker run --rm --entrypoint bun --workdir /opt/bundle opencode-bundle:test run verify
